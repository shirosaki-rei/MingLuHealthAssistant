openapi: 3.1.0
info:
  title: 明路 API
  version: 1.4.0
  description: |
    AI 健康助手 + 医生咨询撮合（非诊疗）。

    ## 变更记录

    | 版本 | 变更 |
    |---|---|
    | 1.3.1 | `POST /v1/timeline/export` 区间内无记录时返回 400 + `VALIDATION_ERROR`，不再生成空摘要链接 |
    | 1.4.0 | 新增 `POST /v1/personas/{id}/avatar`（自定义角色头像，随人设一起送审）与 `Persona.avatar_url` |
    | 1.3.0 | 新增 `POST /v1/me/avatar`（上传头像）与 `User.avatar_url`；`entitlements.max_patients` 区分会员（免费 3 / 会员 6） |
    | 1.2.0 | 新增 `PATCH /v1/me`（改昵称）；`me.update` 进就医路径白名单 |
    | 1.1.0 | 新增 `POST /v1/orders/{id}/pay`、`GET /v1/memories`、`DELETE /v1/memories/{id}`、`DELETE /v1/timeline/{id}`；SSE `done` 事件补 `conversation_id`；新增 `ErrorCode` 枚举与 401 响应；`/v1/config/medical-actions` 改为权威全量清单 |
    | 1.0.0 | 首版 |

    ## 全局约定（前后端必须一致）

    | 项 | 约定 |
    |---|---|
    | 时间 | **ISO 8601 字符串，带时区**，如 `2026-10-22T09:00:00+08:00`。不用毫秒时间戳 |
    | ID | **string（UUID）**。不用自增 int，避免前端把 id 当数字做运算 |
    | 金额 | **integer，单位为分**。不用浮点数，避免 0.1+0.2 问题 |
    | 分页 | 请求 `page`（从 1 开始）+ `page_size`（默认 20，上限 100）；响应 `total` + `has_more` |
    | 错误 | 统一 `{ code, message, request_id }`，HTTP 状态码与业务 code 分离 |
    | 请求追踪 | 每个响应带 `X-Request-Id` 响应头，与后端 `ai_log` 对齐。出错时 `request_id` 同时出现在错误体里 |
    | 鉴权 | `Authorization: Bearer <token>`，除 `/v1/auth/*` 外全部需要；缺失或失效统一 401 + `code: UNAUTHORIZED` |

    ### 关于 `request_id` 的位置

    成功响应保持裸业务对象（不加信封），`request_id` 走 `X-Request-Id` **响应头**；
    错误响应体里带 `request_id` 字段。两端都能拿到，前端报障时读响应头即可。

    ## 就医路径红线

    `/v1/config/medical-actions` 返回的动作清单，**服务端永远放行，不读会员状态**。
    客户端可缓存，但最终判定以服务端为准（防止客户端被篡改绕过）。

    ## 关于客户端时间戳

    提醒接口返回 `fire_at`（ISO 8601）。客户端调用原生闹钟时需要毫秒时间戳，
    由客户端自行转换（`new Date(fire_at).getTime()`），**不要在服务端返回两份**。

servers:
  - url: https://api.minglu.cn
    description: 生产
  - url: http://127.0.0.1:8000
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录与会话
  - name: patient
    description: 就诊人档案
  - name: persona
    description: 角色
  - name: chat
    description: 对话
  - name: preconsult
    description: 预问诊
  - name: match
    description: 科室与医生匹配
  - name: order
    description: 咨询订单
  - name: reminder
    description: 提醒
  - name: health
    description: 报告与时间线
  - name: membership
    description: 会员
  - name: memory
    description: 智能体记忆（查看与删除）
  - name: config
    description: 客户端配置

paths:
  # ---------------- 认证 ----------------
  /v1/auth/sms:
    post:
      tags: [auth]
      summary: 发送验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  example: '13800138000'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                required: [request_id, expires_in]
                properties:
                  request_id: { type: string }
                  expires_in:
                    type: integer
                    description: 验证码有效期（秒）
                    example: 300
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code:
                  type: string
                  minLength: 4
                  maxLength: 6
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 当前账号 ----------------
  /v1/me:
    patch:
      tags: [auth]
      summary: 修改当前账号信息
      description: |
        目前只能改昵称（头像走 `POST /v1/me/avatar`）。手机号是登录凭据，不能在这里改；
        换号等于换账号。
        属于就医路径，**不校验会员状态**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: 已保存，返回更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /v1/me/avatar:
    post:
      tags: [auth]
      summary: 上传头像
      description: |
        multipart 上传，同步落库，直接返回更新后的账号。jpg/png/webp，≤5MB。
        与 `PATCH /v1/me` 共用 `me.update` 这一个 action——都是「改当前账号信息」，
        同属就医路径，**不校验会员状态**。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg/png/webp，≤5MB
      responses:
        '200':
          description: 已保存，返回更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 就诊人 ----------------
  /v1/patients:
    get:
      tags: [patient]
      summary: 就诊人列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Patient' }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [patient]
      summary: 新建就诊人
      description: |
        最多 6 个（本人 + 5 位家人）。未成年人需 `guardian_consent = true`。
        属于就医路径，**不校验会员状态**。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        default:
          $ref: '#/components/responses/Error'

  /v1/patients/{patient_id}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [patient]
      summary: 就诊人详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [patient]
      summary: 修改就诊人
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [patient]
      summary: 删除就诊人
      responses:
        '204': { description: 已删除 }
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 角色 ----------------
  /v1/personas:
    get:
      tags: [persona]
      summary: 角色列表（预设 + 我的）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [presets, mine]
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
                  mine:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [persona]
      summary: 创建自定义角色
      description: |
        每分钟最多 3 次。免费额度用完后返回 `code = PERSONA_QUOTA_EXCEEDED`，
        客户端据此引导，**不要在此接口做付费拦截**（付费在客户端侧引导）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaCreate' }
      responses:
        '201':
          description: 已创建（待审核）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /v1/personas/{persona_id}/avatar:
    post:
      tags: [persona]
      summary: 上传自定义角色头像
      description: |
        multipart 上传，同步落库，直接返回更新后的角色。jpg/png/webp，≤5MB。

        只能传自己创建的角色（`is_preset = false` 且 owner 是自己）——
        预设角色的头像由服务端固定下发，不允许用户改。头像与人设同属一个审核对象，
        审核态见 `Persona.review_status`；未通过的角色整体不可用，头像跟着不可见。

        复用 `persona.create` 这一个 action：都是「建/改自己的角色」，
        **不校验会员状态**（会员只决定能建几个）。
      parameters:
        - name: persona_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg/png/webp，≤5MB
      responses:
        '200':
          description: 已保存，返回更新后的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '403':
          description: 不是你的角色，或传了预设角色的 id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 对话 ----------------
  /v1/chat/stream:
    post:
      tags: [chat]
      summary: 流式对话（SSE）
      description: |
        **响应为 `text/event-stream`，不是 JSON。**

        事件格式：

        ```
        event: delta
        data: {"delta":"先别急着下结论。"}

        event: redflag
        data: {"level":"urgent","message":"...","action":"call_120"}

        event: done
        data: {"request_id":"...","conversation_id":"...","message_id":"...","usage":{"in":2100,"out":320}}
        ```

        **服务端按句缓冲**：一个 `delta` 至少是一个完整句子，不会是半句。
        客户端收到即渲染，不需要自己拼句。

        命中红旗时：先推 `redflag`，再推 `done`，**不继续生成**。

        `conversation_id` 与 `message_id` 在每一轮的 `done` 里都返回。
        首轮（请求未带 `conversation_id`）时客户端**必须**用返回的 `conversation_id` 续下一轮，
        否则会开新会话。`message_id` 是这条 assistant 消息的 id，用于「带着这条问医生」之类的引用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧文本，见本接口描述
        default:
          $ref: '#/components/responses/Error'

  /v1/chat/history:
    get:
      tags: [chat]
      summary: 对话历史
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: patient_id
          in: query
          schema: { type: string }
        - name: conversation_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  total: { type: integer }
                  has_more: { type: boolean }
        default:
          $ref: '#/components/responses/Error'

  /v1/conversations:
    get:
      tags: [chat]
      summary: 会话列表（第三期：历史对话 / 归档）
      description: |
        当前用户的会话，按创建时间倒序。传 `patient_id` 只列该就诊人的；
        不传则列全部（客户端自行按就诊人 / 助手分组）。
        归档过的会话默认不返回，`include_hidden=true` 时才带上。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: patient_id
          in: query
          schema: { type: string }
        - name: include_hidden
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationOut' }
                  total: { type: integer }
                  has_more: { type: boolean }
        default:
          $ref: '#/components/responses/Error'

  /v1/conversations/{conversation_id}:
    patch:
      tags: [chat]
      summary: 归档 / 恢复会话
      description: |
        软归档：置 `hidden=true` 后它从主列表消失，但消息一条不删，
        `include_hidden=true` 仍能查回来。删除会话没有接口——医疗场景不留硬删。
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationOut' }
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 预问诊 ----------------
  /v1/preconsult/start:
    post:
      tags: [preconsult]
      summary: 开始预问诊
      description: 就医路径，不校验会员状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, chief_complaint]
              properties:
                patient_id: { type: string }
                chief_complaint:
                  type: string
                  maxLength: 500
                  example: 头晕乏力五天
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreConsult' }
        default:
          $ref: '#/components/responses/Error'

  /v1/preconsult/{session_id}/answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [preconsult]
      summary: 提交一轮回答
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, answer]
              properties:
                question_id: { type: string }
                answer:
                  description: 字符串或多选值
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
      responses:
        '200':
          description: 返回下一问，或表示已可结束
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreConsult' }
        default:
          $ref: '#/components/responses/Error'

  /v1/preconsult/{session_id}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [preconsult]
      summary: 结束并生成病历
      description: |
        就医路径，不校验会员。

        生成病历草稿并把 `status` 置为 `confirming`，**不会**写时间线。
        用户确认后才写（见 `confirm`）。
      responses:
        '200':
          description: 病历草稿（待用户确认）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalRecord' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /v1/preconsult/{session_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [preconsult]
      summary: 确认病历
      description: |
        就医路径，不校验会员。

        用户在病历确认页点「确认」后调用：`status` → `done`，并写入一条时间线事件。
        幂等，重复调用返回 200。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 允许用户在确认前微调病历字段
              properties:
                chief_complaint: { type: string, maxLength: 500 }
                present_illness: { type: string, maxLength: 2000 }
                past_history: { type: string, maxLength: 1000 }
                allergy_history: { type: string, maxLength: 1000 }
                medication_history: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: 已确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreConsult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 匹配 ----------------
  /v1/match/departments:
    post:
      tags: [match]
      summary: 症状匹配科室
      description: 就医路径，不校验会员状态。返回按置信度排序的 Top3。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symptoms]
              properties:
                symptoms:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
                patient_id: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DepartmentMatch' }
        default:
          $ref: '#/components/responses/Error'

  /v1/doctors:
    get:
      tags: [match]
      summary: 医生列表
      parameters:
        - name: department_code
          in: query
          required: true
          schema: { type: string }
        - name: online_only
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Doctor' }
                  total: { type: integer }
                  has_more: { type: boolean }
        default:
          $ref: '#/components/responses/Error'

  /v1/doctors/{doctor_id}:
    parameters:
      - name: doctor_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [match]
      summary: 医生详情
      description: 就医路径（action `doctor.detail`），不校验会员状态。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /v1/departments:
    get:
      tags: [match]
      summary: 科室列表（症状说不清时让用户自己选）
      description: |
        就医路径，不校验会员状态。

        `POST /v1/match/departments` 一个都没匹配上时（`items` 为空数组），
        用这个列表让用户自己选，别硬猜。`consult_enabled = false` 的科室只给推荐，
        不开放线上咨询，客户端要展示「暂未开放，可先看知识或线下就诊」。
      parameters:
        - name: consult_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name, consult_enabled]
                      properties:
                        code: { type: string }
                        name: { type: string }
                        description: { type: string }
                        consult_enabled: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 订单 ----------------
  /v1/orders:
    post:
      tags: [order]
      summary: 创建咨询订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id, patient_id]
              properties:
                doctor_id: { type: string }
                patient_id: { type: string }
                preconsult_session_id: { type: string }
      responses:
        '201':
          description: 已创建，返回支付参数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default:
          $ref: '#/components/responses/Error'

  /v1/orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [order]
      summary: 订单详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /v1/orders/{order_id}/pay:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [order]
      summary: 发起支付
      description: |
        就医路径（action `order.pay`），**不校验会员状态**。

        返回 `pay_params`，客户端用对应渠道的 SDK 唤起支付。
        支付结果以服务端状态为准，客户端轮询 `GET /v1/orders/{id}` 拿最终状态，
        不要以客户端的支付成功回调作为依据。

        已支付的订单重复调用返回当前 `Order`（幂等），不重复生成支付单。

        > **沙箱行为**：服务端未配置真实支付渠道时（`PAYMENT_MOCK=true`，本地开发默认），
        > 本接口直接置为 `paid` 并返回，用于跑通下游链路。生产必须关闭。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [wechat, alipay]
                  default: wechat
      responses:
        '200':
          description: 支付参数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 提醒 ----------------
  /v1/reminders:
    post:
      tags: [reminder]
      summary: 创建提醒
      description: |
        服务端计算 `fire_at` 并返回，客户端用它注册本机精确闹钟。
        **服务端是唯一决策源**，客户端不做重复规则计算。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        default:
          $ref: '#/components/responses/Error'

  /v1/reminders/pending:
    get:
      tags: [reminder]
      summary: 待触发的提醒（客户端同步用）
      description: |
        客户端在**启动时**与**每次进入提醒页时**调用，用于全量重排本地闹钟。
        这是开机恢复失效时的兜底：只要用户打开过 App，未过期的提醒就能恢复。
      parameters:
        - name: within_hours
          in: query
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 72
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PendingReminder' }
        default:
          $ref: '#/components/responses/Error'

  /v1/reminders/{reminder_id}:
    parameters:
      - name: reminder_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [reminder]
      summary: 删除提醒
      responses:
        '204': { description: 已删除 }
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 健康数据 ----------------
  /v1/reports:
    post:
      tags: [health]
      summary: 上传报告（异步 OCR）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, patient_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg/png，≤5MB
                patient_id: { type: string }
      responses:
        '202':
          description: 已接收，OCR 处理中
          content:
            application/json:
              schema:
                type: object
                required: [report_id, status]
                properties:
                  report_id: { type: string }
                  status:
                    type: string
                    enum: [processing]
        default:
          $ref: '#/components/responses/Error'

  /v1/reports/{report_id}:
    parameters:
      - name: report_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [health]
      summary: 报告详情（含指标与解读）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        default:
          $ref: '#/components/responses/Error'

  /v1/timeline:
    get:
      tags: [health]
      summary: 健康时间线
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineEvent' }
                  total: { type: integer }
                  has_more: { type: boolean }
        default:
          $ref: '#/components/responses/Error'

  /v1/timeline/export:
    post:
      tags: [health]
      summary: 导出就诊摘要
      description: |
        生成一次性链接，有效期 7 天。属于就医路径，不校验会员。

        **区间内一条记录都没有时返回 400 + `VALIDATION_ERROR`，不生成链接**：
        空摘要发给医生没有意义，还会让人以为数据丢了。客户端应在列表为空时先把按钮置灰。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id]
              properties:
                patient_id: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        '201':
          description: 已生成
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '400':
          description: 区间内没有健康记录，没有可导出的内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /v1/exports/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [health]
      summary: 读取导出的就诊摘要（分享页用）
      description: |
        **公开端点，不需要登录**，靠 URL 里的 `token` 鉴权（不可枚举的 UUID）。

        H5 分享页与「发给医生看」都走这里。token 过期后返回 410 +
        `code: NOT_FOUND`，页面展示「已失效」。

        内容为纯文本（`text/plain`），页脚固定「本摘要由用户自行整理，供就诊参考」。
      security: []
      responses:
        '200':
          description: 摘要文本
          content:
            text/plain:
              schema: { type: string }
        '410':
          description: 链接已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /v1/timeline/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [health]
      summary: 删除时间线事件
      description: |
        用户主动删除单条事件，删除后不再出现在时间线，也不再进导出摘要。
        属于就医路径数据，不校验会员。
      responses:
        '204': { description: 已删除 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 智能体记忆 ----------------
  /v1/memories:
    get:
      tags: [memory]
      summary: 智能体记忆列表
      description: |
        用户可查看、修改、删除每一条健康事实。**所有端必须支持**（小程序也必需），
        这是个人信息删除权的落地。属于就医路径，不校验会员。

        记忆绑定**就诊人**，不绑定角色；切换角色后完全共享。
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentMemory' }
                  total: { type: integer }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /v1/memories/{memory_id}:
    parameters:
      - name: memory_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [memory]
      summary: 修改一条记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string, maxLength: 500 }
                key: { type: string, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMemory' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [memory]
      summary: 删除一条记忆
      description: 真删除，所有角色同时失效该条。
      responses:
        '204': { description: 已删除 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 会员 ----------------
  /v1/membership:
    get:
      tags: [membership]
      summary: 当前会员状态
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default:
          $ref: '#/components/responses/Error'

  # ---------------- 客户端配置 ----------------
  /v1/config/medical-actions:
    get:
      tags: [config]
      summary: 就医路径白名单
      description: |
        这些 action 服务端永远放行，**不读会员状态、不做限额降级**。
        客户端可缓存，用于本地预判（少一次网络往返）。
        **客户端预判仅为体验优化，不能作为最终依据。**

        `actions` 是权威全量清单（不再是示例）。覆盖两类**服务端永远放行**的动作：

        - **就医路径**（PRD §1.4）：预问诊、科室推荐、医生、下单支付、红旗急救、
          多就诊人档案、时间线、记忆管理 —— 永久免费、永不弹付费引导、永不做限流降级
        - **自有数据读写**（PRD §4.9）：会员过期只收回增强能力，不收回数据，
          所以列表 / 详情 / 删除一律放行

        可以收费的只有消耗型动作：对话轮次、报告解读次数、提醒条数、自定义角色。

        新增动作必须同步 `services/api/app/modules/entitlement.py` 的 `MEDICAL_ACTIONS`，
        两边不一致由契约测试兜住。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [actions, version]
                properties:
                  actions:
                    type: array
                    items: { type: string }
                    description: 权威全量清单，见接口描述
                  version:
                    type: string
                    description: 变更时递增，客户端据此刷新缓存
              example:
                actions:
                  - patient.list
                  - patient.create
                  - patient.read
                  - patient.update
                  - patient.delete
                  - persona.list
                  - preconsult.start
                  - preconsult.answer
                  - preconsult.finish
                  - preconsult.confirm
                  - match.departments
                  - department.list
                  - doctor.list
                  - doctor.detail
                  - order.create
                  - order.read
                  - order.pay
                  - safety.redflag
                  - safety.crisis
                  - timeline.read
                  - timeline.delete
                  - timeline.export
                  - memory.read
                  - memory.update
                  - memory.delete
                  - chat.history
                  - conversations.list
                  - conversations.archive
                  - reminder.pending
                  - reminder.delete
                  - report.read
                  - membership.read
                  - me.update
                  - config.medical_actions
                  - config.redflag_rules
                version: '2026-10-27.1'
        default:
          $ref: '#/components/responses/Error'

  /v1/redflag/rules:
    get:
      tags: [config]
      summary: 红旗规则（客户端离线兜底）
      description: |
        客户端缓存后在本地做一次预检，用于**模型不可用时**仍能弹干预卡。
        服务端仍是最终判定方。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedFlagRules' }
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PatientId:
      name: patient_id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: 业务错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 触发频控
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未登录或 token 失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给用户的中文
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorCode:
      type: string
      description: |
        业务错误码全集。前端按 code 分支，**不要**按 HTTP 状态码分支（同一个 code 可能对应 200/400/409）。
        `message` 可直接展示，但不应作为逻辑判断依据（会改文案）。
      enum:
        - UNAUTHORIZED
        - VALIDATION_ERROR
        - NOT_FOUND
        - FORBIDDEN
        - RATE_LIMITED
        - SMS_RATE_LIMITED
        - SMS_CODE_INVALID
        - SMS_CODE_EXPIRED
        - PERSONA_QUOTA_EXCEEDED
        - PERSONA_FORBIDDEN_WORD
        - PATIENT_LIMIT_EXCEEDED
        - CHAT_DAILY_LIMIT_EXCEEDED
        - REMINDER_LIMIT_EXCEEDED
        - REPORT_MONTHLY_LIMIT_EXCEEDED
        - PRECONSULT_NOT_ACTIVE
        - PRECONSULT_ALREADY_DONE
        - ORDER_NOT_PAYABLE
        - ORDER_NOT_FOUND
        - DOCTOR_UNAVAILABLE
        - UPLOAD_TOO_LARGE
        - UPLOAD_BAD_TYPE
        - REDFLAG_TRIGGERED
        - UPSTREAM_UNAVAILABLE

    LoginResult:
      type: object
      required: [token, expires_in, user]
      properties:
        token: { type: string }
        expires_in: { type: integer, description: 秒 }
        user: { $ref: '#/components/schemas/User' }

    MeUpdate:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 40
          description: 显示名。不填等于清空，服务端会退回掩码手机号展示。

    User:
      type: object
      required: [id, phone_masked, created_at]
      properties:
        id: { type: string }
        phone_masked:
          type: string
          example: 138****8000
        nickname: { type: string }
        avatar_url:
          type: string
          description: |
            头像地址。没上传过头像时是 `null`，客户端显示昵称首字。
            由 `POST /v1/me/avatar` 上传，报告图片与头像共用同一套存储。
        created_at: { type: string, format: date-time }

    Patient:
      type: object
      required: [id, name, relation, gender, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        relation:
          type: string
          enum: [self, parent, child, spouse, other]
        gender:
          type: string
          enum: [male, female, unknown]
        birth_date: { type: string, format: date }
        height_cm: { type: integer }
        weight_kg: { type: number }
        chronic_conditions:
          type: array
          items: { type: string }
        allergy_notes: { type: string }
        created_at: { type: string, format: date-time }

    PatientCreate:
      type: object
      required: [name, relation, gender]
      properties:
        name: { type: string, maxLength: 20 }
        relation:
          type: string
          enum: [self, parent, child, spouse, other]
        gender:
          type: string
          enum: [male, female, unknown]
        birth_date: { type: string, format: date }
        height_cm: { type: integer }
        weight_kg: { type: number }
        chronic_conditions:
          type: array
          items: { type: string }
        allergy_notes: { type: string }
        guardian_consent:
          type: boolean
          description: 未成年人必填 true

    PatientUpdate:
      type: object
      properties:
        name: { type: string }
        height_cm: { type: integer }
        weight_kg: { type: number }
        chronic_conditions:
          type: array
          items: { type: string }
        allergy_notes: { type: string }

    ConversationOut:
      type: object
      required: [id, patient_id, patient_name, persona_name, last_message, message_count, created_at, hidden]
      properties:
        id: { type: string }
        patient_id: { type: string }
        patient_name: { type: string, description: 就诊人姓名，列表上直接显示 }
        persona_id:
          type: [string, "null"]
          description: 会话创建时用的助手；早期数据可能为 null
        persona_name: { type: string, description: 助手名，null 时是「明路助手」 }
        last_message: { type: string, description: 末条消息正文截断（≤60 字），列表摘要用 }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        hidden: { type: boolean, description: true = 已归档 }

    Persona:
      type: object
      required: [id, name, species, is_preset]
      properties:
        id: { type: string }
        name: { type: string }
        species:
          type: string
          description: 角色种类，如 猫娘 / 精灵 / 傲娇姐姐
        self_ref: { type: string, description: 自称方式 }
        catchphrase: { type: string }
        worldview: { type: string }
        tones:
          type: array
          items: { type: string }
          description: 语气标签，如 温柔 / 简洁 / 稍带调侃
        is_preset: { type: boolean }
        avatar_url:
          type: [string, "null"]
          description: |
            头像 URL。**预设角色**由服务端固定下发（`/static/avatars/*.jpg`），客户端不得改；
            **自定义角色**为用户上传，需审核通过后才返回，否则为 null。
        review_status:
          type: string
          enum: [pending, approved, rejected]
        created_at: { type: string, format: date-time }

    PersonaCreate:
      type: object
      required: [name, species]
      properties:
        name: { type: string, maxLength: 12 }
        species: { type: string, maxLength: 12 }
        self_ref: { type: string, maxLength: 12 }
        catchphrase: { type: string, maxLength: 40 }
        worldview: { type: string, maxLength: 200 }
        tones:
          type: array
          maxItems: 3
          items: { type: string }

    ChatRequest:
      type: object
      required: [patient_id, content]
      properties:
        patient_id: { type: string }
        content: { type: string, maxLength: 2000 }
        conversation_id:
          type: string
          description: 不传则新建会话
        persona_id:
          type: string
          description: 不传则用默认预设

    ChatMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant, system]
        content: { type: string }
        source_refs:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
        redflag_level:
          type: string
          enum: [none, attention, urgent, crisis]
        created_at: { type: string, format: date-time }

    SourceRef:
      type: object
      required: [title, publisher, updated_at]
      properties:
        title: { type: string }
        publisher: { type: string }
        url: { type: string, format: uri }
        updated_at: { type: string, format: date-time }

    PreConsult:
      type: object
      required: [id, status, round, questions]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [asking, confirming, done, aborted_redflag]
        round: { type: integer }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        answers:
          type: object
          additionalProperties: true
        redflag_level:
          type: string
          enum: [none, attention, urgent, crisis]

    Question:
      type: object
      required: [id, text, type]
      properties:
        id: { type: string }
        text: { type: string }
        type:
          type: string
          enum: [single, multiple, text, number]
        options:
          type: array
          items: { type: string }
        required: { type: boolean }

    MedicalRecord:
      type: object
      required: [session_id, chief_complaint, present_illness, ready_for_confirm]
      properties:
        session_id: { type: string }
        chief_complaint: { type: string }
        present_illness: { type: string }
        past_history: { type: string }
        allergy_history: { type: string }
        medication_history: { type: string }
        suggested_departments:
          type: array
          items: { type: string }
        ready_for_confirm: { type: boolean }

    DepartmentMatch:
      type: object
      required: [code, name, confidence, reason]
      properties:
        code: { type: string }
        name: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
          description: 可解释的匹配理由，如「头晕伴颈部不适，倾向神经内科」

    Doctor:
      type: object
      required: [id, name, department_code, title]
      properties:
        id: { type: string }
        name: { type: string }
        department_code: { type: string }
        department_name: { type: string }
        title: { type: string, example: 副主任医师 }
        hospital: { type: string }
        specialties:
          type: array
          items: { type: string }
        online_status:
          type: string
          enum: [online, busy, offline]
        price_cents:
          type: integer
          description: 单次咨询价格（分）
        response_minutes:
          type: integer
          description: 平均响应时间（分钟）
        match_reason:
          type: string
          description: 「为什么推荐这位」

    Order:
      type: object
      required: [id, status, amount_cents, created_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_pay, paid, doctor_replying, completed, refunded, cancelled]
        amount_cents: { type: integer }
        doctor_id: { type: string }
        patient_id: { type: string }
        pay_params:
          type: object
          additionalProperties: true
          description: 支付参数，按渠道不同
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }

    Reminder:
      type: object
      required: [id, patient_id, kind, fire_at, status]
      properties:
        id: { type: string }
        patient_id: { type: string }
        kind:
          type: string
          enum: [medication, measurement, followup, custom]
        title: { type: string }
        content: { type: string }
        fire_at:
          type: string
          format: date-time
          description: 下次触发时间，客户端据此注册本机闹钟
        recurrence:
          type: string
          description: RRULE 或简单描述，如 daily / weekly:mon,wed / once
        status:
          type: string
          enum: [pending, fired, cancelled]
        created_at: { type: string, format: date-time }

    ReminderCreate:
      type: object
      required: [patient_id, kind, title, fire_at]
      properties:
        patient_id: { type: string }
        kind:
          type: string
          enum: [medication, measurement, followup, custom]
        title: { type: string, maxLength: 40 }
        content: { type: string, maxLength: 200 }
        fire_at: { type: string, format: date-time }
        recurrence: { type: string, default: once }

    PendingReminder:
      type: object
      required: [id, fire_at, title]
      properties:
        id: { type: string }
        fire_at: { type: string, format: date-time }
        title: { type: string }
        content: { type: string }

    Report:
      type: object
      required: [id, patient_id, status, created_at]
      properties:
        id: { type: string }
        patient_id: { type: string }
        status:
          type: string
          enum: [processing, done, failed]
        image_url: { type: string, format: uri }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportItem' }
        summary: { type: string }
        created_at: { type: string, format: date-time }

    ReportItem:
      type: object
      required: [name, value, unit]
      properties:
        name: { type: string, example: 血红蛋白 }
        value: { type: string, example: '118' }
        unit: { type: string, example: g/L }
        ref_low: { type: number }
        ref_high: { type: number }
        flag:
          type: string
          enum: [normal, low, high, abnormal]

    TimelineEvent:
      type: object
      required: [id, type, occurred_at, title]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [consult, report, preconsult, measurement, medication]
        occurred_at: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string }
        ref_id:
          type: string
          description: 关联对象 id（订单 / 报告 / 预问诊会话）

    AgentMemory:
      type: object
      required: [id, type, key, value, created_at]
      properties:
        id: { type: string }
        patient_id: { type: string }
        type:
          type: string
          enum: [fact, pref, event]
          description: fact 事实（过敏史/慢病/用药）｜pref 偏好｜event 事件（「上周感冒好了」）
        key: { type: string, example: allergy }
        value: { type: string, example: 青霉素过敏 }
        source_msg_id:
          type: string
          description: 提取自哪条对话，供用户追溯
        confirmed_at:
          type: string
          format: date-time
          description: 用户确认时间。null 表示 AI 记了但用户还没确认
        created_at: { type: string, format: date-time }

    Membership:
      type: object
      required: [status, plan, expires_at]
      properties:
        status:
          type: string
          enum: [none, active, expired]
        plan:
          type: string
          enum: [monthly, yearly, none]
        expires_at: { type: string, format: date-time }
        entitlements:
          type: object
          additionalProperties: true
          description: |
            权益额度。**免费版与会员版数值不同的有三项**：
            `max_patients`（免费 3 / 会员 6）、`custom_persona_quota`（免费 0 / 会员 3）、
            `max_reminders`（免费 3 / 会员不限，值为 `null`）。
            下面示例是**免费版**的数值。
          example:
            daily_chat_limit: 20
            custom_persona_quota: 0
            max_patients: 3
            max_reminders: 3

    RedFlagRules:
      type: object
      required: [version, rules]
      properties:
        version: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [id, keywords, level, action]
            properties:
              id: { type: string }
              keywords:
                type: array
                items: { type: string }
              level:
                type: string
                enum: [attention, urgent, crisis]
              action:
                type: string
                enum: [show_card, call_120, encourage_emergency]
              message: { type: string }
