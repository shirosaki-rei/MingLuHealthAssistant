# 明路后端。单机起步（架构 §7.1：4C8G 一台，日活过万再拆）。
#
#   cp .env.example .env   # 填 JWT_SECRET 等
#   docker compose up --build
#
# api 之前会先跑一次性的 migrate 服务（alembic upgrade head），
# 容器自己不跑 DDL —— 架构 §7.3。
#
# 改 POSTGRES_PASSWORD 之后如果报 password authentication failed：
# postgres 的 entrypoint 只初始化**空**数据目录，旧 pgdata 卷沿用旧密码。
# 开发库无所谓，`docker compose down -v` 删卷重来。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minglu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minglu-dev-only}
      POSTGRES_DB: minglu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minglu -d minglu"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 宿主机重启 / docker 守护进程重启后必须自己回来，否则 api 连不上库。
    # 默认的 no 会让数据库安静地躺在 Exited 状态，表现为「api 一直 resolve host 'db'」。
    restart: unless-stopped
    # 不对外暴露端口，只有同网络的 api 能连

  migrate:
    build: ./services/api
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://minglu:${POSTGRES_PASSWORD:-minglu-dev-only}@db:5432/minglu
      MINGLU_ENV: prod
      # migrate 只做 DDL，却会 import get_settings()，一样要过 prod 启动自检。
      # 少这三项就 exit 1，api 又被 depends_on 卡着起不来 —— 表现为「库是健康的，
      # 服务就是不出现」。默认值与 app/config.py 保持一致，缺省时照样能正确报错。
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
      PAYMENT_MOCK: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 反向代理 + 自动 HTTPS。放在 api 前面，对外只暴露 80/443。
  #
  # 为什么是 Caddy：证书的申请与续期全自动，nginx + certbot 那套要自己写
  # 续期脚本，漏一步就是 80 天后证书静默过期，用户看到的是「连不上」。
  #
  # caddy_data 卷存证书和私钥，**别删**——删了下次重新签，而 Let's Encrypt
  # 有速率限制（同一域名每周 5 次）。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://minglu:${POSTGRES_PASSWORD:-minglu-dev-only}@db:5432/minglu
      MINGLU_ENV: prod
      # 不设就用 dev 默认值，但 MINGLU_ENV=prod 下 app/config.py 的启动自检会直接拒绝起来
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      # 运营后台账号（/admin）。prod 自检要求它非默认值，不同步传进来就会拒绝启动。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
      # 沙箱支付：生产必须关闭
      PAYMENT_MOCK: "false"
      # 境内模型服务商，白名单在 app/platform/llm.py 硬编码
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      STORAGE_DIR: /srv/var/storage
    volumes:
      - apistorage:/srv/var/storage
    # 演示期先留着这个映射：App 直连 http://<域名或IP>:8000，不经过 Caddy，
    # 未备案也能跑。等 ICP 备案通过、Caddyfile 换成域名形态（自动 HTTPS）之后，
    # 再把这段换成 expose: ["8000"]——那时对外只留 80/443，8000 不再裸奔。
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  apistorage:
  caddy_data:
